name: sure-statistics pipeline

on:
  workflow_dispatch: {}
  schedule:
    # Cada 30 min, L-V, 07:00-16:59 UTC. Cubre de sobra la pre-apertura y
    # apertura de Wall Street en hora de Madrid (CET/CEST), con margen para
    # el cambio de hora. Ajustar si se quiere más frecuencia (ver README:
    # coste en minutos gratuitos de Actions).
    - cron: "*/30 7-16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: sure-statistics-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sure-statistics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sure-statistics/package-lock.json

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pipeline (genera data/latest.json + histórico)
        run: npm run pipeline
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit y push del snapshot generado
        run: |
          git config user.name "sure-statistics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/frontend/public/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos, no se commitea."
          else
            git commit -m "chore(sure-statistics): actualiza snapshot de datos"
            git push
          fi
